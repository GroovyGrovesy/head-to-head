<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Head to Head</title>
    <meta name="description" content="Page not found. The page you're looking for doesn't exist or has been moved.">
    <meta name="robots" content="noindex, follow">
    <meta property="og:title" content="Page Not Found — Head to Head">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://head-to-head.uk/404.html">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-weight='bold' fill='%23fafafa'>H</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --fg: #fafafa;
            --accent: #a3e635;
            --muted: #71717a;
            --border: #27272a;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* Header */
        header {
            padding: 32px 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--fg);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        /* Hero */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 0;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(163, 230, 53, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .error-code {
            font-size: clamp(5rem, 12vw, 8rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .hero h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--muted);
            max-width: 440px;
            margin: 0 auto 40px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: var(--accent);
            color: #0a0a0a;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-secondary {
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Footer */
        footer {
            padding: 32px 0;
            border-top: 1px solid var(--border);
        }

        .footer-content {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-content p {
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* Animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero > * {
            animation: fadeUp 0.8s ease-out backwards;
        }

        .hero > *:nth-child(1) { animation-delay: 0.1s; }
        .hero > *:nth-child(2) { animation-delay: 0.2s; }
        .hero > *:nth-child(3) { animation-delay: 0.3s; }
        .hero > *:nth-child(4) { animation-delay: 0.4s; }
        .hero > *:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">head to head<span>.</span></a>
        </div>
    </header>

    <main class="hero container">
        <div class="error-code">404</div>
        <h1>Page not found</h1>
        <p>
            The page you're looking for doesn't exist or has been moved. If you were looking for our blood tests comparison site, it's still here.
        </p>
        <div class="links">
            <a href="/" class="btn">Back to Home</a>
            <a href="https://bloodtests.head-to-head.uk" class="btn btn-secondary">Blood Tests</a>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Head to Head. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
